apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: splunk-ingress
  namespace: splunk-operator
  annotations:
    # Enable SSL redirect if using HTTPS
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    # Increase proxy timeouts for large uploads/searches
    nginx.ingress.kubernetes.io/proxy-connect-timeout: "600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "600"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "600"
    nginx.ingress.kubernetes.io/proxy-body-size: "100m"
spec:
  ingressClassName: nginx
  tls:
  - hosts:
    - splunk.padugg.com
    secretName: wildcard-padugg-com-tls
  rules:
  - host: splunk.padugg.com
    http:
      paths:
      # Splunk Web UI (port 8000)
      - path: /
        pathType: Prefix
        backend:
          service:
            name: splunk-stdln-standalone-headless
            port:
              number: 8000
      # Splunk HTTP Event Collector (HEC) - port 8088
      - path: /services/collector
        pathType: Prefix
        backend:
          service:
            name: splunk-stdln-standalone-headless
            port:
              number: 8088
      # Management port (optional) - port 8089
      - path: /services
        pathType: Prefix
        backend:
          service:
            name: splunk-stdln-standalone-headless
            port:
              number: 8089
