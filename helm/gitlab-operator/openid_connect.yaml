apiVersion: v1
kind: Secret
metadata:
  name: gitlab-omniauth
  namespace: gitlab-system
stringData:
  openid_connect: |
    {
    name: "openid_connect",
    label: "Keycloak",
      args: {
    name: "openid_connect",
        scope: ["openid", "profile", "email", "groups"],
        response_type: "code",
        issuer: "https://keycloak.padugg.com/realms/master",
        client_auth_method: "query",
        discovery: true,
        uid_field: "email",
        pkce: false,
        client_options: {
          identifier: "gitlab",
          secret: "<SECRET>",
          redirect_uri: "https://gitlab.padugg.com/users/auth/openid_connect/callback",
          gitlab: {
            group_attribute: 'groups',
            admin_groups: ["Admins"],
          }
        }
      }
    }
