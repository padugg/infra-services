apiVersion: apps.gitlab.com/v1beta1
kind: GitLab
metadata:
  name: gitlab
  namespace: gitlab-system
spec:
  chart:
    version: "9.2.0" 
    values:
      installCertmanager: false
      nginx-ingress:
        enabled: false
      global:
        hosts:
          domain: padugg.com # use a real domain here
        ingress:
          configureCertmanager: false
          class: nginx
          tls:
            secretName: wildcard-padugg-com-tls
